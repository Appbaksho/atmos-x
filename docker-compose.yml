# Local development services (prompt-v1.md §8.1). `make db` starts Postgres 16 + PostGIS.
# Bound to 127.0.0.1:5433 so it never collides with a Postgres already listening on 5432.
# Production uses docker-compose.prod.yml.
services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: atmos
      POSTGRES_PASSWORD: atmos
      POSTGRES_DB: atmos
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - atmos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmos -d atmos"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

volumes:
  atmos-pg:
